services:
  - type: web
    name: credimitra
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run migrate && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "false"
      - key: WHATSAPP_NUMBER
        value: "918918007538"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: credimitra-db
          property: connectionString

databases:
  - name: credimitra-db
    plan: free
    region: singapore
